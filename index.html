<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecapAI Pro - Movie Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 600px; width: 100%; background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #58a6ff; margin-bottom: 20px; font-size: 24px; }
        
        .section { margin-bottom: 20px; background: #21262d; padding: 15px; border-radius: 8px; border: 1px solid #30363d; }
        .section-title { font-size: 14px; color: #8b949e; text-transform: uppercase; font-weight: bold; margin-bottom: 10px; display: block; }
        
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #c9d1d9; }
        input[type="text"], input[type="number"], select, textarea {
            width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; margin-bottom: 12px; font-size: 14px;
        }
        input:focus, select:focus, textarea:focus { border-color: #58a6ff; outline: none; }

        .upload-box {
            border: 2px dashed #238636; border-radius: 8px; padding: 25px; text-align: center; cursor: pointer; background: #161b22; transition: 0.3s;
        }
        .upload-box:hover { background: #1c2128; border-color: #2ea043; }

        .btn-main {
            width: 100%; padding: 14px; background: #238636; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s;
        }
        .btn-main:hover { background: #2ea043; }
        .btn-main:disabled { background: #484f58; cursor: not-allowed; }

        .progress-box { margin-top: 20px; display: none; }
        .progress-bar-bg { background: #30363d; height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
        .progress-bar-fill { background: #58a6ff; width: 0%; height: 100%; transition: width 0.2s; }
        .progress-text { font-size: 13px; color: #8b949e; text-align: center; }

        .result-box { margin-top: 20px; display: none; text-align: center; }
        video { width: 100%; border-radius: 8px; margin-bottom: 15px; background: #000; border: 1px solid #30363d; }
        .btn-download {
            display: inline-block; padding: 12px 24px; background: #1f6feb; color: white; text-decoration: none; border-radius: 6px; font-weight: bold;
        }
        .btn-download:hover { background: #388bfd; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 RecapAI Pro Movie Studio</h1>

    <!-- API Key & Settings Section -->
    <div class="section">
        <span class="section-title">⚙️ AI & Voice Settings</span>
        <label>Gemini API Key (Optional)</label>
        <input type="text" id="apiKeyInput" placeholder="Enter Gemini API Key (If available)...">

        <label>Narration Voice Language (ဇာတ်ကြောင်းပြော အသံ)</label>
        <select id="voiceLangSelect">
            <option value="my">Myanmar (မြန်မာအသံ)</option>
            <option value="en">English (အင်္ဂလိပ်အသံ)</option>
        </select>

        <label>Clip Duration (ခွဲထုတ်မည့် စက္ကန့်)</label>
        <input type="number" id="chunkSizeInput" value="3" min="1" max="10">
    </div>

    <!-- Upload Section -->
    <div class="section">
        <span class="section-title">📁 Video Input</span>
        <input type="file" id="videoFileInput" accept="video/*" style="display: none;">
        <div class="upload-box" id="dropArea">
            <p id="uploadStatusText" style="font-weight: bold; color: #3fb950;">🎬 ဗီဒီယိုဖိုင် ရွေးချယ်ရန် ဤနေရာကို နှိပ်ပါ</p>
            <p style="font-size: 12px; color: #8b949e; margin-top: 5px;">(ဖုန်းထဲမှ Video ဖိုင်ကို တိုက်ရိုက် တင်နိုင်ပါသည်။)</p>
        </div>
    </div>

    <!-- Action Button -->
    <button class="btn-main" id="startBtn">⚡ Generate Movie Recap Video</button>

    <!-- Progress Status -->
    <div class="progress-box" id="progressBox">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="statusText">စတင်နေပါသည်... (0%)</div>
    </div>

    <!-- Video Output Result -->
    <div class="result-box" id="resultBox">
        <h3 style="color: #3fb950; margin-bottom: 10px;">🎉 Movie Recap Video ပြုလုပ်ပြီးပါပြီ</h3>
        <video id="outVideo" controls playsinline></video>
        <br>
        <a id="dlBtn" class="btn-download" download="Movie_Recap.webm">📥 Download Recap Video</a>
    </div>
</div>

<script>
    const fileInput = document.getElementById('videoFileInput');
    const dropArea = document.getElementById('dropArea');
    const uploadText = document.getElementById('uploadStatusText');
    const startBtn = document.getElementById('startBtn');
    const progressBox = document.getElementById('progressBox');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const resultBox = document.getElementById('resultBox');
    const outVideo = document.getElementById('outVideo');
    const dlBtn = document.getElementById('dlBtn');

    let loadedFile = null;

    dropArea.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            loadedFile = e.target.files[0];
            uploadText.innerText = `✅ ရွေးချယ်ပြီး: ${loadedFile.name}`;
        }
    });

    startBtn.addEventListener('click', async () => {
        if (!loadedFile) {
            alert("ကျေးဇူးပြု၍ ဗီဒီယိုဖိုင် ရွေးချယ်ပေးပါ!");
            return;
        }

        const chunkSize = parseInt(document.getElementById('chunkSizeInput').value) || 3;
        const lang = document.getElementById('voiceLangSelect').value;

        startBtn.disabled = true;
        progressBox.style.display = 'block';
        resultBox.style.display = 'none';

        try {
            const vUrl = URL.createObjectURL(loadedFile);
            const tempVid = document.createElement('video');
            tempVid.src = vUrl;
            tempVid.muted = true;
            tempVid.playsInline = true;

            await new Promise(res => tempVid.onloadedmetadata = res);

            const duration = tempVid.duration; 
            const totalClips = Math.floor(duration / chunkSize);

            if (totalClips < 1) {
                alert("ဗီဒီယိုသည် အနည်းဆုံး ရွေးချယ်ထားသော စက္ကန့် ပမာဏ ရှိရပါမည်။");
                startBtn.disabled = false;
                return;
            }

            // Setup Canvas & Audio Streams
            const canvas = document.createElement('canvas');
            canvas.width = tempVid.videoWidth || 640;
            canvas.height = tempVid.videoHeight || 360;
            const ctx = canvas.getContext('2d');
            const canvasStream = canvas.captureStream(30);

            let mimeType = 'video/webm';
            if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
                mimeType = 'video/webm;codecs=vp8';
            } else if (MediaRecorder.isTypeSupported('video/mp4')) {
                mimeType = 'video/mp4';
            }

            const recorder = new MediaRecorder(canvasStream, { mimeType });
            const chunks = [];

            recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
            recorder.start(100);

            for (let i = 0; i < totalClips; i++) {
                const startTime = i * chunkSize;
                const pct = Math.round(((i + 1) / totalClips) * 100);
                
                statusText.innerText = `Clip (${i + 1}/${totalClips}) Processing... (${pct}%)`;
                progressFill.style.width = pct + '%';

                tempVid.currentTime = startTime;
                await new Promise(r => tempVid.onseeked = r);

                // Speak Audio locally while processing
                const script = lang === 'my' 
                    ? `ဒီအခန်းမှာတော့ ဇာတ်လမ်းရဲ့ အစိတ်အပိုင်း အမှတ် ${i + 1} ဖြစ်ပါတယ်။` 
                    : `This is scene number ${i + 1}.`;
                
                speakText(script, lang);

                let elapsed = 0;
                tempVid.play();
                while (elapsed < chunkSize) {
                    ctx.drawImage(tempVid, 0, 0, canvas.width, canvas.height);
                    await new Promise(r => setTimeout(r, 33));
                    elapsed += 0.033;
                }
                tempVid.pause();
            }

            recorder.stop();

            recorder.onstop = () => {
                const finalBlob = new Blob(chunks, { type: mimeType });
                const resUrl = URL.createObjectURL(finalBlob);
                outVideo.src = resUrl;
                dlBtn.href = resUrl;
                dlBtn.download = `Movie_Recap.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
                resultBox.style.display = 'block';
                statusText.innerText = "Recap Video ပြုလုပ်ပြီးပါပြီ!";
                startBtn.disabled = false;
            };

        } catch (err) {
            alert("အမှားတစ်ခု ဖြစ်ပေါ်ခဲ့ပါသည်။ " + err.message);
            startBtn.disabled = false;
        }
    });

    function speakText(text, lang) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utt = new SpeechSynthesisUtterance(text);
            utt.lang = lang === 'my' ? 'my-MM' : 'en-US';
            utt.rate = 1.0;
            window.speechSynthesis.speak(utt);
        }
    }
</script>

</body>
</html>
