<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecapAI Pro - Myanmar Voice Video Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0d1117; color: #ffffff; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; }
        h2 { text-align: center; color: #58a6ff; margin-bottom: 20px; }
        
        .upload-box {
            border: 2px dashed #3fb950; border-radius: 8px; padding: 30px 15px;
            text-align: center; cursor: pointer; background: #21262d; transition: 0.3s;
        }
        .upload-box:active { background: #282e33; }
        
        .btn-process {
            width: 100%; margin-top: 20px; padding: 14px; background: #238636;
            color: white; border: none; border-radius: 6px; font-weight: bold;
            font-size: 16px; cursor: pointer;
        }
        .btn-process:disabled { background: #484f58; cursor: not-allowed; }
        
        .progress-box { margin-top: 20px; display: none; }
        .progress-bar-bg { background: #30363d; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 8px; }
        .progress-bar-fill { background: #58a6ff; width: 0%; height: 100%; transition: width 0.2s; }
        .progress-text { font-size: 13px; color: #8b949e; text-align: center; }

        .result-box { margin-top: 20px; display: none; text-align: center; }
        video { width: 100%; border-radius: 8px; margin-bottom: 12px; background: #000; }
        .btn-download {
            display: inline-block; padding: 10px 20px; background: #1f6feb;
            color: white; text-decoration: none; border-radius: 6px; font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎬 RecapAI Pro Studio</h2>

    <input type="file" id="videoFileInput" accept="video/*" style="display: none;">

    <div class="upload-box" id="dropArea">
        <p id="uploadStatusText" style="font-weight: bold; font-size: 16px;">📁 ဗီဒီယို တင်ရန် ဤနေရာကို နှိပ်ပါ</p>
        <p style="font-size: 12px; color: #8b949e; margin-top: 5px;">(မြန်မာ AI အသံပါဝင်သော Recap Video ပြုလုပ်မည်)</p>
    </div>

    <button class="btn-process" id="startBtn">Generate Full Recap Video</button>

    <div class="progress-box" id="progressBox">
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="progress-text" id="statusText">စတင်နေပါသည်... (0%)</div>
    </div>

    <div class="result-box" id="resultBox">
        <h3>🎉 မြန်မာအသံပါသော Recap Video ရပါပြီ</h3>
        <video id="outVideo" controls playsinline></video>
        <a id="dlBtn" class="btn-download" download="Movie_Recap_Myanmar.webm">Download Video</a>
    </div>
</div>

<script>
    const fileInput = document.getElementById('videoFileInput');
    const dropArea = document.getElementById('dropArea');
    const uploadText = document.getElementById('uploadStatusText');
    const startBtn = document.getElementById('startBtn');
    const progressBox = document.getElementById('progressBox');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const resultBox = document.getElementById('resultBox');
    const outVideo = document.getElementById('outVideo');
    const dlBtn = document.getElementById('dlBtn');

    let loadedFile = null;

    dropArea.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
            loadedFile = e.target.files[0];
            uploadText.innerText = `✅ ရွေးချယ်ပြီး: ${loadedFile.name}`;
            uploadText.style.color = '#3fb950';
        }
    });

    // CORS Audio Decoder for Myanmar AI Voice
    async function fetchMyanmarAudioBuffer(text, audioCtx) {
        const googleTtsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=my&q=${encodeURIComponent(text)}`;
        const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(googleTtsUrl)}`;
        
        try {
            const res = await fetch(proxyUrl);
            if (!res.ok) throw new Error("Proxy error");
            const arrayBuffer = await res.arrayBuffer();
            return await audioCtx.decodeAudioData(arrayBuffer);
        } catch (err) {
            console.warn("Proxy 1 failed, trying proxy 2...", err);
            const fallbackUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(googleTtsUrl)}`;
            const res2 = await fetch(fallbackUrl);
            const arrayBuffer2 = await res2.arrayBuffer();
            return await audioCtx.decodeAudioData(arrayBuffer2);
        }
    }

    startBtn.addEventListener('click', async () => {
        if (!loadedFile) {
            alert("ကျေးဇူးပြု၍ ဗီဒီယိုဖိုင် ရွေးချယ်ပေးပါ!");
            return;
        }

        startBtn.disabled = true;
        progressBox.style.display = 'block';
        resultBox.style.display = 'none';

        try {
            const vUrl = URL.createObjectURL(loadedFile);
            const tempVid = document.createElement('video');
            tempVid.src = vUrl;
            tempVid.muted = true;
            tempVid.playsInline = true;

            await new Promise(res => tempVid.onloadedmetadata = res);

            const duration = tempVid.duration; 
            const chunkSize = 3; 
            const totalClips = Math.floor(duration / chunkSize);

            if (totalClips < 1) {
                alert("ဗီဒီယိုသည် အနည်းဆုံး ၃ စက္ကန့် ရှိရပါမည်။");
                startBtn.disabled = false;
                return;
            }

            // Canvas Setup (Video Track)
            const canvas = document.createElement('canvas');
            canvas.width = tempVid.videoWidth || 640;
            canvas.height = tempVid.videoHeight || 360;
            const ctx = canvas.getContext('2d');
            const canvasStream = canvas.captureStream(30);

            // Web Audio API Setup (Myanmar Voice Audio Track)
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
            const audioDest = audioCtx.createMediaStreamDestination();

            // Combine Video + Audio Streams
            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...audioDest.stream.getAudioTracks()
            ]);

            let mimeType = 'video/webm';
            if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
                mimeType = 'video/webm;codecs=vp8';
            } else if (MediaRecorder.isTypeSupported('video/mp4')) {
                mimeType = 'video/mp4';
            }

            const recorder = new MediaRecorder(combinedStream, { mimeType });
            const chunks = [];

            recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
            recorder.start(100);

            for (let i = 0; i < totalClips; i++) {
                const startTime = i * chunkSize;
                const pct = Math.round(((i + 1) / totalClips) * 100);
                
                statusText.innerText = `Clip (${i + 1}/${totalClips}) အတွက် မြန်မာ AI အသံ ပေါင်းစပ်နေပါသည်... (${pct}%)`;
                progressFill.style.width = pct + '%';

                tempVid.currentTime = startTime;
                await new Promise(r => tempVid.onseeked = r);

                // Fetch & Inject Myanmar Voice Audio into Video Audio Track
                const speechScript = `ဒီအခန်းမှာတော့ ဇာတ်လမ်းရဲ့ အစိတ်အပိုင်း အမှတ် ${i + 1} ကို တွေ့ရမှာ ဖြစ်ပါတယ်။`;
                try {
                    const audioBuffer = await fetchMyanmarAudioBuffer(speechScript, audioCtx);
                    const sourceNode = audioCtx.createBufferSource();
                    sourceNode.buffer = audioBuffer;
                    sourceNode.connect(audioDest); // Stream directly to video recorder
                    sourceNode.connect(audioCtx.destination); // Play to speaker
                    sourceNode.start();
                } catch (audioErr) {
                    console.error("Audio Injection Error:", audioErr);
                }

                let elapsed = 0;
                tempVid.play();
                while (elapsed < chunkSize) {
                    ctx.drawImage(tempVid, 0, 0, canvas.width, canvas.height);
                    await new Promise(r => setTimeout(r, 33));
                    elapsed += 0.033;
                }
                tempVid.pause();
            }

            recorder.stop();

            recorder.onstop = () => {
                const finalBlob = new Blob(chunks, { type: mimeType });
                const resUrl = URL.createObjectURL(finalBlob);
                outVideo.src = resUrl;
                dlBtn.href = resUrl;
                dlBtn.download = `Movie_Recap_Myanmar.${mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
                resultBox.style.display = 'block';
                statusText.innerText = "မြန်မာအသံပါဝင်သော Recap Video ပြုလုပ်ပြီးပါပြီ!";
                startBtn.disabled = false;
            };

        } catch (err) {
            alert("အမှားတစ်ခု ဖြစ်ပေါ်ခဲ့ပါသည်။ " + err.message);
            startBtn.disabled = false;
        }
    });
</script>

</body>
</html>
